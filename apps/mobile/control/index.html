<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://static-cdn.jtvnw.net https://clips-media-assets2.twitch.tv https://clips-media-assets.twitch.tv; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:; frame-src https://player.twitch.tv https://www.twitch.tv; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e18">
<title>Le StreamCockpit · Régie</title>
<link rel="stylesheet" href="control.css">
<link rel="stylesheet" href="performance.css">
<link rel="stylesheet" href="twitch-chat.css">
<link rel="stylesheet" href="mobile-panes.css">
<link rel="stylesheet" href="mobile-ergonomics.css">
<link rel="stylesheet" href="alpha27-spontaneous-style.css">
<link rel="stylesheet" href="deck-action-layout.css">
<link rel="stylesheet" href="streamcockpit-timer.css">
<link rel="stylesheet" href="streamcockpit-mobile-v2.css">
<script type="module" src="control.js"></script>
</head>
<body>
<aside>
  <a class="brand" href="#live"><span class="brand-icon">◈</span><span>Le StreamCockpit<small>VOTRE ESPACE</small></span></a>
  <p class="eyebrow">VOTRE RÉGIE</p>
  <nav aria-label="Navigation principale">
    <button type="button" class="compact-only" data-page="home" aria-label="Accueil">⌂ <span>Accueil</span></button>
    <span class="desktop-nav cockpit-nav-group">Régie</span>
    <button type="button" data-page="live" aria-label="Live">◉ <span>Live</span></button>
    <button type="button" data-page="sounds" aria-label="Sons">♫ <span>Sons</span></button>
    <button type="button" class="compact-only" data-page="plus" aria-label="Plus">☷ <span>Plus</span></button>
    <button type="button" data-page="deck">▦ <span>Mon Deck</span></button>
    <span class="desktop-nav cockpit-nav-group">Administration</span>
    <button type="button" class="desktop-nav" data-page="planning" aria-label="Planning">▤ <span>Planning</span></button>
    <button type="button" class="desktop-nav" data-page="settings">⚙ <span>Configuration</span></button>
    <button type="button" data-page="activity">✦ <span>Activité</span></button>
    <button type="button" data-page="manage">☷ <span>Gestion</span></button>
  </nav>
  <div class="aside-foot"><span class="dot" id="host-dot"></span><span id="host-name">Connexion à la régie</span><small>Exécution sur le PC de stream</small></div>
</aside>
<div class="workspace">
  <header>
    <div><span class="eyebrow" id="role">RÉGIE PARTAGÉE</span><p id="connection">Connexion en cours…</p></div>
    <div class="header-actions">
      <button id="workspace-toggle" data-task="use-local" class="secondary">Mon espace</button>
      <button id="sync-status" data-task="sync-status" class="secondary">Synchronisation</button>
      <button data-task="device-accounts" class="secondary">Mes comptes</button>
      <button data-task="connection" class="secondary">Appareils</button>
    </div>
  </header>
  <section id="mobile-timer-strip" class="mobile-timer-strip" hidden>
    <button type="button" class="mobile-timer-strip-action" data-task="open-mobile-timer" aria-label="Voir le minuteur de la régie">
      <span class="timer-strip-caption"><span class="timer-strip-kicker">⏱ MINUTEUR RÉGIE</span><span class="timer-strip-detail" data-timer-status>En attente</span></span>
      <strong data-timer-clock>--:--:--</strong><span aria-hidden="true" class="timer-strip-chevron">›</span>
    </button>
  </section>
  <main id="content" tabindex="-1"></main>
  <footer>Votre live, vos commandes, vos appareils.</footer>
</div>
<nav id="mobile-pane-nav" class="mobile-pane-rail" aria-label="Volets de cette rubrique" role="tablist" hidden></nav>
<div id="floating-mic-battery" aria-live="polite" hidden></div>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="dialog"><button class="close secondary" data-task="close-dialog" aria-label="Fermer">×</button><div id="dialog-content"></div></dialog>
</body>
</html>
