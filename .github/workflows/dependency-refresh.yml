name: Dependency refresh validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-refresh-lockfile
          path: package-lock.json
      - name: Install exact regenerated graph
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --include=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Static security invariants
        run: npm run security:check
