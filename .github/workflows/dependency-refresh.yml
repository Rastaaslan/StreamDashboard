name: Dependency refresh validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile when needed
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(security): regenerate dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install exact regenerated graph
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --include=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Static security invariants
        run: npm run security:check
