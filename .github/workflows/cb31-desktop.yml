name: CB38 Desktop ZIP
on:
  push:
    branches:
      - ci-cb31-build-0cddfdd
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild validated snapshot
        shell: pwsh
        run: |
          $parts = 1..7 | ForEach-Object { Get-Content -Raw ("ci/parts/{0}.b64" -f $_) }
          [IO.File]::WriteAllBytes("snapshot.tar", [Convert]::FromBase64String(($parts -join "")))
          New-Item -ItemType Directory -Force snapshot | Out-Null
          tar -xf snapshot.tar -C snapshot
      - name: Build desktop
        shell: pwsh
        run: |
          Set-Location snapshot
          npm ci
          npm test
          npm run build
          npm run security:check
          npm run check:shipped-js
          npm run desktop:package
      - name: Upload desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StreamDashboard-Desktop-CB38
          path: snapshot/out/StreamDashboard-win32-x64/**
          if-no-files-found: error
