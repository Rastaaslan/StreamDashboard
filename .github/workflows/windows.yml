name: Windows desktop
on:
  pull_request:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || 'rksd5h9msic7t4kf1hgxygdv8lhbku' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies including Electron toolchain
        run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run security:check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development toolchain
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

      - name: Require signing secrets for official tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw 'Official tagged releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD.'
          }
      - name: Prepare signing certificate for official tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\streamdashboard.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$env:RUNNER_TEMP\streamdashboard.pfx" | Out-File $env:GITHUB_ENV -Append

      - name: Package Windows application
        run: npm run desktop:package
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      - name: Smoke the packaged Windows executable
        shell: pwsh
        run: |
          $env:STREAMDASHBOARD_PACKAGED_EXE = (Resolve-Path 'out/StreamDashboard-win32-x64/StreamDashboard.exe')
          npm run desktop:package-smoke
      - name: Verify packaged app signature for official tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appExe = Resolve-Path 'out/StreamDashboard-win32-x64/StreamDashboard.exe'
          $signature = Get-AuthenticodeSignature $appExe
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $appExe: $($signature.Status)" }
      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: StreamDashboard-Windows-x64
          path: out/StreamDashboard-win32-x64/**

      - name: Make Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run desktop:make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify installer Authenticode before publication
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $executables = Get-ChildItem out/make -Recurse -Include *.exe -File
          if (-not $executables) { throw 'No Windows installer was produced.' }
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)" }
          }
      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Get-ChildItem out/make -Recurse -File | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content out/make/checksums-SHA256.txt
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" --generate-notes (Get-ChildItem out/make -Recurse -File | ForEach-Object FullName)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
