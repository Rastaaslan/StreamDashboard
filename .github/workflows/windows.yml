name: Windows desktop

on:
  pull_request:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || 'rksd5h9msic7t4kf1hgxygdv8lhbku' }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies including Electron toolchain
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Static security invariants
        run: npm run security:check
      - name: Check mobile JavaScript syntax
        run: node --check apps/mobile/mobile.js
      - name: Smoke remote/mobile security flow
        run: npm run mobile:smoke
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development toolchain
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - name: Package Windows application
        run: npm run desktop:package
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ''
      - name: Smoke the packaged Windows executable
        shell: pwsh
        run: |
          $env:STREAMDASHBOARD_PACKAGED_EXE = (Resolve-Path 'out/StreamDashboard-win32-x64/StreamDashboard.exe')
          npm run desktop:package-smoke
      - name: Upload packaged Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StreamDashboard-Windows-x64
          path: out/StreamDashboard-win32-x64/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || 'rksd5h9msic7t4kf1hgxygdv8lhbku' }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require signing secrets
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Official tagged releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD.'
          }
      - name: Prepare signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificate = "$env:RUNNER_TEMP\streamdashboard.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File $env:GITHUB_ENV -Append
      - name: Package signed Windows application
        run: npm run desktop:package
      - name: Verify packaged app signature
        shell: pwsh
        run: |
          $appExe = Resolve-Path 'out/StreamDashboard-win32-x64/StreamDashboard.exe'
          $signature = Get-AuthenticodeSignature $appExe
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $appExe: $($signature.Status)" }
      - name: Build signed Windows installer
        run: npm run desktop:make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installer Authenticode
        shell: pwsh
        run: |
          $executables = Get-ChildItem out/make -Recurse -Include *.exe -File
          if (-not $executables) { throw 'No Windows installer was produced.' }
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)" }
          }
      - name: Generate checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\','/')
            "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $relative"
          } | Set-Content out/make/checksums-SHA256.txt
      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --generate-notes }
          $assets = Get-ChildItem out/make -Recurse -File | ForEach-Object FullName
          gh release upload "${{ github.ref_name }}" --clobber $assets
