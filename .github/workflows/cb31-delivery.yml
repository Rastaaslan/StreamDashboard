name: CB31 delivery build

on:
  push:
    branches:
      - ci-cb31-build-0cddfdd

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild validated snapshot
        shell: pwsh
        run: |
          $chunks = 1..7 | ForEach-Object { Get-Content -Raw ("ci/cb31-parts/{0}.b64" -f $_) }
          $b64 = $chunks -join ""
          [IO.File]::WriteAllBytes("cb31-snapshot.tar", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash cb31-snapshot.tar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "5cbcbbccd44348767dfbed9faf6f7e0df7699cfcd11c0a6a4889ef68c9fdf1c1") { throw "Snapshot SHA256 mismatch: $hash" }
          New-Item -ItemType Directory -Force cb31-snapshot | Out-Null
          tar -xf cb31-snapshot.tar -C cb31-snapshot
      - name: Install and validate
        shell: pwsh
        working-directory: cb31-snapshot
        run: |
          npm ci
          npm test
          npm run build
          npm run security:check
          npm run check:shipped-js
      - name: Package Windows
        shell: pwsh
        working-directory: cb31-snapshot
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ""
        run: npm run desktop:package
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: StreamDashboard-CB31-EXE
          path: cb31-snapshot/out/StreamDashboard-win32-x64/StreamDashboard.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rebuild validated snapshot
        shell: bash
        run: |
          cat ci/cb31-parts/{1,2,3,4,5,6,7}.b64 | base64 -d > cb31-snapshot.tar
          echo "5cbcbbccd44348767dfbed9faf6f7e0df7699cfcd11c0a6a4889ef68c9fdf1c1  cb31-snapshot.tar" | sha256sum -c -
          mkdir -p cb31-snapshot
          tar -xf cb31-snapshot.tar -C cb31-snapshot
      - name: Install and validate
        working-directory: cb31-snapshot
        run: |
          npm ci
          npm test
          npm run build
          npm run security:check
          npm run check:shipped-js
          npm run android:sync
      - name: Build APKs
        working-directory: cb31-snapshot
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug testPreviewUnitTest lintPreview assemblePreview
          cp android/app/build/outputs/apk/debug/app-debug.apk ../StreamDashboard-Remote-debug-CB31.apk
          cp android/app/build/outputs/apk/preview/app-preview.apk ../StreamDashboard-Preview-CB31.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamDashboard-CB31-APK
          path: |
            StreamDashboard-Remote-debug-CB31.apk
            StreamDashboard-Preview-CB31.apk
          if-no-files-found: error
