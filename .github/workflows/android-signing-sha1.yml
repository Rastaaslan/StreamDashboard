name: Android signing SHA1

on:
  pull_request:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Print release certificate SHA-1 only
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          KEYSTORE="$RUNNER_TEMP/streamdashboard-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          SHA1=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n -E 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)
          test -n "$SHA1"
          echo "STREAMDASHBOARD_ANDROID_RELEASE_SHA1=$SHA1"
