name: Android remote

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.2
        with:
          # The action's default includes the legacy `tools` package, which is no
          # longer published by the current Android SDK repository. The runner
          # already provides platform/build tooling and Gradle installs any
          # project-specific SDK components it requires.
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Validate local behavioral contracts
        run: node tests/cb2-local.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate shared remote
        run: npm test && npm run build && npm run security:check && npm run check:shipped-js && npm run mobile:smoke
      - name: Synchronize Android assets
        run: npm run android:sync
      - name: Preview build note
        run: |
          echo "Preview APK build - Android OAuth IDs/signing are intentionally not required on this temporary test branch."
      - name: Lint and build Preview APK
        run: |
          ./android/gradlew -p android testDebugUnitTest lintDebug assemblePreview
          cp android/app/build/outputs/apk/preview/app-preview.apk StreamDashboard-Preview.apk
      - name: Verify Preview APK
        shell: bash
        run: |
          APK=StreamDashboard-Preview.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$AAPT" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.rastaaslan.streamdashboard.remote.preview'"
          "$AAPT" dump badging "$APK" | grep "application-label:'StreamDashboard Preview'"
      - name: Upload Android Preview APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StreamDashboard-Preview
          path: StreamDashboard-Preview.apk
          if-no-files-found: error
