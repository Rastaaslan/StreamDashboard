name: Android remote

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'
      - name: Install dependencies
        run: npm ci
      - name: Validate shared remote
        run: npm test && npm run build && npm run security:check && npm run mobile:smoke
      - name: Synchronize Android assets
        run: npm run android:sync
      - name: Lint and build debug APK
        run: gradle -p android lintDebug assembleDebug
      - name: Name installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/StreamDashboard-Remote-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StreamDashboard-Remote-debug
          path: android/app/build/outputs/apk/debug/StreamDashboard-Remote-debug.apk
          if-no-files-found: error
