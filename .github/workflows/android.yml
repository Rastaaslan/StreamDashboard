name: Android qualification and signed release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.2
        with:
          # The action's default includes the legacy `tools` package, which is no
          # longer published by the current Android SDK repository. The runner
          # already provides platform/build tooling and Gradle installs any
          # project-specific SDK components it requires.
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Validate local behavioral contracts
        run: node tests/cb2-local.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for renderer tests
        run: npx playwright install --with-deps chromium
      - name: Validate shared remote
        run: npm test && npm run build && npm run security:check && npm run check:shipped-js && npm run mobile:smoke
      - name: Mobile browser regression gate
        run: npm run test:browser
      - name: Synchronize Android assets
        run: npm run android:sync
      - name: Read Android product identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const gradle = readFileSync('android/app/build.gradle', 'utf8');
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const match = (pattern, name) => {
            const value = gradle.match(pattern)?.[1];
            if (!value) throw new Error(`Android ${name} is missing from build.gradle.`);
            return value;
          };
          const applicationId = match(/applicationId\s+'([A-Za-z0-9_.]+)'/, 'application ID');
          const versionCode = match(/def buildVersionCode\s*=\s*\(System\.getenv\('ANDROID_VERSION_CODE'\)\s*\?:\s*'(\d+)'\)/, 'version code');
          const versionName = match(/def buildVersionName\s*=\s*System\.getenv\('ANDROID_VERSION_NAME'\)\s*\?:\s*'([A-Za-z0-9.-]+)'/, 'version name');
          if (applicationId !== 'com.rastaaslan.streamdashboard.remote.next') throw new Error('Unexpected Android product identity.');
          if (!Number.isSafeInteger(Number(versionCode)) || Number(versionCode) <= 0) throw new Error('Invalid Android version code.');
          if (versionName !== manifest.version) throw new Error('Android and package.json versions differ.');
          appendFileSync(process.env.GITHUB_ENV, `ANDROID_APPLICATION_ID=${applicationId}\nANDROID_VERSION_CODE=${versionCode}\nANDROID_VERSION_NAME=${versionName}\n`);
          console.log(`Android product: ${applicationId}, ${versionName} (${versionCode})`);
          NODE
      - name: Lint, test and build QA APKs without signing secrets
        run: |
          ./android/gradlew -p android --max-workers=2 testDebugUnitTest lintDebug assembleDebug assemblePreview
          cp android/app/build/outputs/apk/debug/app-debug.apk StreamDashboard-Next-QA-debug.apk
          cp android/app/build/outputs/apk/preview/app-preview.apk StreamDashboard-Next-QA-preview.apk
          cat > Android-QA-README.txt <<'NOTE'
          QA artifacts only, signed with the runner's temporary debug certificate.
          These APKs are not a stable signed release or an update for an installed app.
          Debug has the production package ID: use a disposable test device/profile.
          Preview has a separate package ID and disables provider connections.
          Google sign-in on Debug also depends on registration of its package/certificate;
          this qualification does not demonstrate a real provider login.
          NOTE
      - name: Verify QA APK identities and signatures
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$AAPT" && test -x "$AAPT"
          for VARIANT in debug preview; do
            APK="StreamDashboard-Next-QA-$VARIANT.apk"
            PACKAGE_ID="$ANDROID_APPLICATION_ID"
            VERSION_NAME="$ANDROID_VERSION_NAME"
            if [[ "$VARIANT" == preview ]]; then PACKAGE_ID+='.preview'; VERSION_NAME+='-preview'; fi
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            BADGING=$("$AAPT" dump badging "$APK")
            PACKAGE_LINE="${BADGING%%$'\n'*}"
            if [[ "$PACKAGE_LINE" != "package: name='$PACKAGE_ID' versionCode='$ANDROID_VERSION_CODE' versionName='$VERSION_NAME'"* ]]; then
              echo "QA APK package or version mismatch ($VARIANT)." >&2
              exit 1
            fi
            if [[ "$VARIANT" == preview ]]; then
              printf '%s\n' "$BADGING" | grep -Fx "application-label:'StreamDashboard Preview'"
            fi
          done
          echo "ANDROID_APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ANDROID_AAPT=$AAPT" >> "$GITHUB_ENV"
      - name: Upload Android QA artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StreamDashboard-Next-QA-${{ github.run_id }}
          path: |
            StreamDashboard-Next-QA-debug.apk
            StreamDashboard-Next-QA-preview.apk
            Android-QA-README.txt
          if-no-files-found: error
      - name: Require release Twitch client ID
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TWITCH_ANDROID_CLIENT_ID: ${{ secrets.TWITCH_ANDROID_CLIENT_ID || vars.TWITCH_ANDROID_CLIENT_ID || vars.TWITCH_CLIENT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const distribution = JSON.parse(readFileSync('resources/distribution.json', 'utf8'));
          const clientId = process.env.TWITCH_ANDROID_CLIENT_ID || distribution.twitchClientId || '';
          if (!/^[A-Za-z0-9]+$/.test(clientId)) throw new Error('A valid Twitch client ID is required for release APKs.');
          appendFileSync(process.env.GITHUB_ENV, `TWITCH_ANDROID_CLIENT_ID=${clientId}\n`);
          NODE
      - name: Require stable Android signing identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_CERT_SHA256" ]]; then
            echo "Stable Android signing is not configured. Refusing to publish an ephemeral debug-signed APK." >&2
            exit 1
          fi
          EXPECTED_CERT_SHA256=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[A-F0-9]{64}$ ]]; then
            echo "Stable Android certificate SHA-256 must contain exactly 64 hexadecimal digits." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/streamdashboard-remote.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build stable signed release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android --max-workers=2 assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "StreamDashboard-Next-${ANDROID_VERSION_NAME}-android.apk"
      - name: Verify release APK identity, version and stable signature
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          APK="StreamDashboard-Next-${ANDROID_VERSION_NAME}-android.apk"
          test -s "$APK"
          test -x "$ANDROID_APKSIGNER" && test -x "$ANDROID_AAPT"
          CERTS=$("$ANDROID_APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERTS"
          mapfile -t CERT_DIGESTS < <(printf '%s\n' "$CERTS" | sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p')
          if [[ "${#CERT_DIGESTS[@]}" -ne 1 ]]; then
            echo "Exactly one stable Android signing certificate is required." >&2
            exit 1
          fi
          ACTUAL_CERT_SHA256=$(printf '%s' "${CERT_DIGESTS[0]}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT_SHA256=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[A-F0-9]{64}$ || "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Stable Android signing certificate SHA-256 mismatch." >&2
            exit 1
          fi
          BADGING=$("$ANDROID_AAPT" dump badging "$APK")
          PACKAGE_LINE="${BADGING%%$'\n'*}"
          if [[ "$PACKAGE_LINE" != "package: name='$ANDROID_APPLICATION_ID' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'"* ]]; then
            echo "Release APK package or version mismatch." >&2
            exit 1
          fi
      - name: Upload stable Android release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StreamDashboard-Next-${{ env.ANDROID_VERSION_NAME }}-android
          path: StreamDashboard-Next-${{ env.ANDROID_VERSION_NAME }}-android.apk
          if-no-files-found: error
      - name: Remove decoded signing material
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then rm -f -- "$ANDROID_KEYSTORE_PATH"; fi
