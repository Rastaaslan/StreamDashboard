plugins { id 'com.android.application' }

android {
    namespace 'com.rastaaslan.streamdashboard.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rastaaslan.streamdashboard.remote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
