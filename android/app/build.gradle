plugins { id 'com.android.application' }

dependencies { implementation 'androidx.core:core:1.15.0' }

def stableKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
def hasStableSigning = stableKeystore && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')
def buildVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '900001') as Integer
def buildVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '0.9.0-rc.1'

android {
    namespace 'com.rastaaslan.streamdashboard.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rastaaslan.streamdashboard.remote'
        minSdk 26
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }
    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile file(stableKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
    }
}
